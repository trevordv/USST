openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Solar Project Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Solar project operations
  - name: scans
    description: Scan operations
  - name: contact-enrichments
    description: Contact enrichment run status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List solar projects
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD)
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD)
        - name: country
          in: query
          required: false
          schema:
            type: string
            enum: [AU, NZ, ALL]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: scanId
          in: query
          required: false
          schema:
            type: integer
            description: Filter to only projects discovered in this scan run
        - name: hasContact
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of solar projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Manually add a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a single project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /projects/{id}/research:
    post:
      operationId: researchProject
      tags: [projects]
      summary: Research supporting public evidence for an existing project
      description: Admin-only bounded Brave research. Returns evidence without creating or updating projects.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bounded project research evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResearchResponse"
        "400":
          description: Invalid project ID
        "401":
          description: Authentication required
        "403":
          description: Account is not authorized
        "404":
          description: Project not found
        "429":
          description: Project research already running or in cooldown
        "502":
          description: Project research unavailable

  /projects/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Aggregate stats for the current project list
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/export:
    get:
      operationId: exportProjects
      tags: [projects]
      summary: Export projects as CSV
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          schema:
            type: string
        - name: country
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: scanId
          in: query
          required: false
          schema:
            type: integer
        - name: hasContact
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /projects/enrich-contacts:
    post:
      operationId: startContactEnrichment
      tags: [contact-enrichments]
      summary: Start a contact enrichment run
      responses:
        "202":
          description: Contact enrichment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnrichmentStart"
        "401":
          description: Authentication required
        "403":
          description: Account is not authorized
        "500":
          description: Contact enrichment could not be started

  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List scan history
      responses:
        "200":
          description: Scan history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanRun"
    post:
      operationId: triggerScan
      tags: [scans]
      summary: Trigger a new scan of all sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "202":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRun"

  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get scan run status and results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRun"
        "404":
          description: Not found

  /scans/{id}/projects:
    get:
      operationId: getScanProjects
      tags: [scans]
      summary: List all projects discovered by a scan
      description: Returns every project found by this scan run (both new and existing), with an isNew flag on each.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of projects with isNew flag
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanProject"
        "404":
          description: Scan not found

  /contact-enrichments/{id}:
    get:
      operationId: getContactEnrichment
      tags: [contact-enrichments]
      summary: Get contact enrichment run status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Enrichment run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnrichment"
        "404":
          description: Enrichment run not found

  /auth/token:
    post:
      operationId: createAccessToken
      tags: [auth]
      summary: Create a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenInput"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: Unauthorized

  /auth/tokens:
    get:
      operationId: listAccessTokens
      tags: [auth]
      summary: List all access tokens
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessToken"
        "401":
          description: Unauthorized

  /auth/tokens/{id}:
    delete:
      operationId: revokeAccessToken
      tags: [auth]
      summary: Revoke an access token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked
        "401":
          description: Unauthorized

  /auth/validate:
    post:
      operationId: validateAccessToken
      tags: [auth]
      summary: Validate an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Valid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenValidation"
        "401":
          description: Invalid or expired token

  /epbc/projects:
    get:
      operationId: listEpbcProjects
      tags: [epbc]
      summary: List EPBC projects with optional filters
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: technology
          in: query
          schema: { type: string }
        - name: relevanceStatus
          in: query
          schema: { type: string }
        - name: approvalStatus
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of EPBC projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EpbcProject"

  /epbc/meta:
    get:
      operationId: getEpbcMeta
      tags: [epbc]
      summary: Get EPBC sync metadata (last scraped date, total count)
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpbcMeta"

  /epbc/sync:
    post:
      operationId: syncEpbc
      tags: [epbc]
      summary: Trigger a manual EPBC portal sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpbcSyncResult"
        "502":
          description: Portal unavailable

  /epbc/projects/{id}:
    patch:
      operationId: updateEpbcProject
      tags: [epbc]
      summary: Update classification fields on an EPBC project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpbcProjectPatch"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpbcProject"
        "404":
          description: Not found

  /epbc/projects/{id}/import:
    post:
      operationId: importEpbcProject
      tags: [epbc]
      summary: Import an EPBC project into the main projects table
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpbcImportResult"
        "404":
          description: EPBC record not found
        "409":
          description: Already imported

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Project:
      type: object
      required: [id, name, country, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        capacityMw:
          type: ["number", "null"]
        developer:
          type: ["string", "null"]
        epc:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        country:
          type: string
          enum: [AU, NZ]
        status:
          type: string
          enum: [announced, under_development]
        sourceUrl:
          type: ["string", "null"]
        sourceName:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        announcedDate:
          type: ["string", "null"]
        announcedDateEvidence:
          type: ["string", "null"]
        lastSeenAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        scanId:
          type: ["integer", "null"]

    ProjectInput:
      type: object
      required: [name, country, status, announcedDate]
      properties:
        name:
          type: string
        description:
          type: string
        capacityMw:
          type: number
        developer:
          type: string
        epc:
          type: string
        location:
          type: string
        country:
          type: string
          enum: [AU, NZ]
        status:
          type: string
          enum: [announced, under_development]
        sourceUrl:
          type: string
        sourceName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        announcedDate:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        capacityMw:
          type: number
        developer:
          type: string
        epc:
          type: string
        location:
          type: string
        country:
          type: string
          enum: [AU, NZ]
        status:
          type: string
          enum: [announced, under_development]
        sourceUrl:
          type: string
        sourceName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        announcedDate:
          type: string

    ProjectStats:
      type: object
      required: [total, byCountry, byStatus, totalCapacityMw, recentCount]
      properties:
        total:
          type: integer
        byCountry:
          type: object
          additionalProperties:
            type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        totalCapacityMw:
          type: number
        recentCount:
          type: integer
          description: Projects announced in the last 7 days

    BraveResearchEvidence:
      type: object
      required: [title, url, source, searchedAt, queryHash, purpose]
      properties:
        title:
          type: string
        url:
          type: string
        source:
          type: string
        description:
          type: ["string", "null"]
        searchedAt:
          type: string
        queryHash:
          type: string
        purpose:
          type: string
          enum: [project_corroboration, developer_website_discovery, contact_research]

    ProjectResearchResponse:
      type: object
      required: [projectId, purpose, evidence]
      properties:
        projectId:
          type: integer
        purpose:
          type: string
          enum: [project_corroboration]
        evidence:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/BraveResearchEvidence"

    ScanRun:
      type: object
      required: [id, status, startedAt, sourcesScanned, projectsFound]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [running, completed, failed]
        startedAt:
          type: string
        completedAt:
          type: ["string", "null"]
        sourcesScanned:
          type: integer
        projectsFound:
          type: integer
        newProjects:
          type: integer
        errorMessage:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]

    ScanInput:
      type: object
      properties:
        startDate:
          type: string
          description: Only scan for projects announced after this date (YYYY-MM-DD)
        endDate:
          type: string
          description: Only scan for projects announced before this date (YYYY-MM-DD)

    ScanProject:
      type: object
      required: [id, name, country, status, createdAt, updatedAt, isNew]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        capacityMw:
          type: ["number", "null"]
        developer:
          type: ["string", "null"]
        epc:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        country:
          type: string
          enum: [AU, NZ]
        status:
          type: string
          enum: [announced, under_development]
        sourceUrl:
          type: ["string", "null"]
        sourceName:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        announcedDate:
          type: ["string", "null"]
        announcedDateEvidence:
          type: ["string", "null"]
        lastSeenAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        scanId:
          type: ["integer", "null"]
        isNew:
          type: boolean
          description: True if this project was newly inserted during this scan

    ContactEnrichment:
      type: object
      required: [id, status, startedAt, checked, updated]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [running, completed, failed]
        startedAt:
          type: string
        completedAt:
          type: ["string", "null"]
        checked:
          type: integer
        updated:
          type: integer
        errorMessage:
          type: ["string", "null"]

    ContactEnrichmentStart:
      type: object
      required: [runId, status]
      properties:
        runId:
          type: integer
        status:
          type: string
          enum: [running]

    AccessToken:
      type: object
      required: [id, token, expiresAt, createdAt, revoked]
      properties:
        id:
          type: integer
        token:
          type: string
        label:
          type: ["string", "null"]
        expiresAt:
          type: string
        createdAt:
          type: string
        revoked:
          type: boolean

    AccessTokenInput:
      type: object
      required: [expiresAt]
      properties:
        label:
          type: string
        expiresAt:
          type: string
          description: ISO 8601 datetime (e.g. 2025-12-31T23:59:59Z)

    AccessTokenValidation:
      type: object
      required: [valid, expiresAt]
      properties:
        valid:
          type: boolean
        id:
          type: integer
        label:
          type: ["string", "null"]
        expiresAt:
          type: string

    EpbcProject:
      type: object
      required: [id, epbcNumber, projectName, isRenewable, isSolar, isApproved, relevanceStatus, scrapedAt, updatedAt]
      properties:
        id:
          type: integer
        epbcNumber:
          type: string
        projectName:
          type: string
        proponent:
          type: ["string", "null"]
        industryType:
          type: ["string", "null"]
        projectStatus:
          type: ["string", "null"]
        decisionStatus:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        technologyType:
          type: ["string", "null"]
        sizeMw:
          type: ["number", "null"]
        referralDate:
          type: ["string", "null"]
        approvalDate:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        rawDescription:
          type: ["string", "null"]
        isRenewable:
          type: boolean
        isSolar:
          type: boolean
        isApproved:
          type: boolean
        relevanceStatus:
          type: string
        scrapedAt:
          type: string
        updatedAt:
          type: string

    EpbcMeta:
      type: object
      required: [total]
      properties:
        lastScrapedAt:
          type: ["string", "null"]
        total:
          type: integer

    EpbcSyncResult:
      type: object
      required: [newCount, updatedCount, total]
      properties:
        newCount:
          type: integer
        updatedCount:
          type: integer
        total:
          type: integer

    EpbcProjectPatch:
      type: object
      properties:
        relevanceStatus:
          type: string
        isSolar:
          type: boolean
        isApproved:
          type: boolean
        technologyType:
          type: string

    EpbcImportResult:
      type: object
      required: [projectId, message]
      properties:
        projectId:
          type: integer
        message:
          type: string
